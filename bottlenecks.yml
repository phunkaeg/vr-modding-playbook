      BioshockVR: {state: open, evidence: LIVE, note: "XInput/native camera and weapon endpoints are mapped; body-yaw snap turn and some action ownership remain active work."}
      SOMAVR: {state: cleared, evidence: HEADSET, note: "Native analog mover, action routes, focus-loss release and haptic bridge are working."}
      PreyVR: {state: open, evidence: LIVE, note: "Detached melee/use ray proofs pass; projectile and complete action-family ownership remain."}
      DishonoredVR: {state: risk, note: "PlayerController action strings are static anchors only."}
      FarCry2-vr: {state: active, evidence: LIVE, note: "Native aim contract is read; viewmodel/muzzle alignment and final fire-direction delivery remain."}
