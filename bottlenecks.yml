    current_question: Does the rendered image follow the head once the view seam lands, and is Crytek's own one-traversal two-submission path (rung 1b) cheaper than the alternate-eye route now shipping?
    next_proof: Land the view seam so the image tracks the head, then run the alignment diagnosis; separately locate CD3D9Renderer::RT_RenderScene to price rung 1b, whose downstream is identical to the route already proven.
