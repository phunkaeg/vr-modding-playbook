    stage: pre-T1 stereo architecture
    primary: [BN-STE-001, BN-SFX-001]
    current_question: Can C3DEngine::RenderWorld execute a second live pass from an arbitrary CCamera without corrupting pooled render views, usage modes, aim observers or frame side effects?
