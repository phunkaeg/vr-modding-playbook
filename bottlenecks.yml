# bottlenecks.yml — fleet-wide critical-path bottleneck ledger.
#
# This is not a bug list. A bottleneck is a missing fact or capability that
# prevents the next playbook gate from producing a valid verdict. Project-local
# details remain in each project's CURRENT_STATE / FAILURE_REGISTRY / evidence
# logs; this ledger stores the transferable class and fleet routing state.
#
# State meanings:
#   active  current critical path; downstream verdicts depend on it
#   open    unresolved, but another bottleneck is currently earlier
#   risk    expected or structurally plausible; not yet exercised
#   cleared the named exit proof passed (not "the subsystem is perfect")
#   na      demonstrated not applicable to this project's selected route

updated_at: 2026-08-27

bottlenecks:
  - id: BN-ACC-001
    title: Integration authority is not classified
    applies_to: both
    gate: ACCESS
    blocks: Choosing an architecture, estimating work, and deciding whether RE findings are shipping dependencies or merely source oracles.
    fast_test: Ask whether the code that owns the camera and world-render loop can be legally built, modified, and shipped for the exact retail assets/build.
    exit_proof: AUTHORITY_MAP names the shipping route—source-owned, RE-owned, or hybrid—and names every code layer that remains closed.
    route: "[Choose the route](start-new-port.md#port-01)"
    projects:
      ss2vr-work: {state: cleared, evidence: SOURCE, note: "Native KEX injector plus a shipped Squirrel bridge; engine source is not the delivery boundary."}
      BioshockVR: {state: cleared, evidence: STATIC, note: "Native x86 injector against a closed Vengeance build."}
      SOMAVR: {state: cleared, evidence: SOURCE, note: "Native OpenGL injector, with HPL2 source and SOMA scripts used as readable oracles."}
      PreyVR: {state: cleared, evidence: STATIC, note: "Native x64 injector; PreyDll.dll is the closed gameplay/render ownership boundary."}
      DishonoredVR: {state: cleared, evidence: STATIC, note: "Native x86 injector against UE3/D3D9."}
      FarCry2-vr: {state: cleared, evidence: LIVE, note: "Native x86 injector against Dunia.dll; editor symbols are leads, not a shippable source route."}
      Swat4-VR: {state: cleared, evidence: SOURCE, note: "Hybrid evidence route: shipped UnrealScript/SDK and exports are oracles; the deliverable remains a native injector."}
      Sims4VR: {state: cleared, evidence: LIVE, note: "Hybrid candidate: Python controls gameplay camera state; a future native D3D11 layer must own stereo and submission."}
      SoF-VR: {state: cleared, evidence: STATIC, note: "Hybrid: RE-owned at the ref_gl module contract, delivered as a proxy DLL selected by a cvar; the SoF SDK and id Quake 2 tree are oracles. No byte of SoF.exe or ref_gl.dll is patched for T1."}
      Medal-of-Honor-vr: {state: cleared, evidence: SOURCE, note: "Source-owned at every layer: the shipping binary is an OpenMoHAA fork built from source under GPL-2.0, not the retail executable. Retail supplies assets and a behaviour reference only."}

  - id: BN-LOAD-001
    title: The active bytes and test session are not proven
    applies_to: both
    gate: BASELINE
    blocks: Every interpretation of “the change had no effect,” every A/B, and every headset verdict.
    fast_test: Require the first log line to contain version, build time, loaded path, executable hash, PID, mode, and config identity; run a harmless canary.
    exit_proof: A fresh log alone proves which build/config entered which executable, and a vanilla control proves the launch recipe did not change the target.
    route: "[RE-03](reverse-engineered-route.md#re-03) or [SRC-01](source-owned-route.md#src-01)"
    projects:
      ss2vr-work: {state: cleared, evidence: LIVE, note: "Self-identifying DLL/config lines retired stale-package and ignored-key false tests."}
      BioshockVR: {state: cleared, evidence: LIVE, note: "Release-tag and canonical-path handoffs are part of every runtime verdict."}
      SOMAVR: {state: cleared, evidence: LIVE, note: "Build flavor, loader path, runtime and prior-log preservation are explicit."}
      PreyVR: {state: cleared, evidence: SOURCE, note: "Build and runtime baselines plus landmark gates identify the target."}
      DishonoredVR: {state: open, evidence: STATIC, note: "Exact executable hash is established; deterministic mod-load proof has not yet become the primary gate."}
      FarCry2-vr: {state: cleared, evidence: LIVE, note: "Launch preconditions and build-time OpenXR option are logged; vanilla and mod recipes are distinct."}
      Swat4-VR: {state: cleared, evidence: LIVE, note: "Fresh-log injected launch and test-artifact config identity are explicit."}
      Sims4VR: {state: open, evidence: LIVE, note: "Retail build and tool observations are pinned; there is no mod build yet because the project remains pre-feasibility."}
      SoF-VR: {state: cleared, evidence: LIVE, note: "M0 load proof: the identity line carries version, build, path and config; the original renderer loads from the same directory at the expected base and PE timestamp; clean detach. A vanilla control must now pass the renderer cvar explicitly, because the VR one is archived."}
      Medal-of-Honor-vr: {state: cleared, evidence: LIVE, note: "Retail hashes, prerequisites, flat build and launch each have a dated receipt; the port build is hash-identified and the retail install is never written to."}

  - id: BN-OBS-001
    title: The active renderer and frame boundary are not owned
    applies_to: both
    gate: OBSERVE
    blocks: Safe XR timing, render-target capture, scene replay, and attribution of menu/loading/gameplay frames.
    fast_test: Log thread, context/device, backbuffer identity, dimensions, format, call rate, and transition behavior at each candidate boundary.
    exit_proof: One named callback owns gameplay frames with understood menu/loading/device-reset behavior; a control proves the hook is not observing a launcher or secondary swapchain.
    route: "[RE-04](reverse-engineered-route.md#re-04) or [SRC-02](source-owned-route.md#src-02)"
    projects:
      ss2vr-work: {state: cleared, evidence: LIVE, note: "KEX render and D3D11 ownership are established."}
      BioshockVR: {state: cleared, evidence: LIVE, note: "D3D11/private-HDR frame ownership is sustained and logged."}
      SOMAVR: {state: cleared, evidence: LIVE, note: "OpenGL context, SwapBuffers and HPL render-stage ownership are live-mapped."}
      PreyVR: {state: cleared, evidence: LIVE, note: "EndRendererScene, live swapchain/device and renderer singleton are reproduced."}
      DishonoredVR: {state: active, evidence: LIVE, note: "Present wrapper +0x5C0180 proven by a LIVE breakpoint at the device Present target returning to +0x5C01A4, hitting every frame - 682 Presents in five seconds. RHI global +0x103EC78, factory +0x5C2D70, constructor +0x5C27C0 and device field RHI+0x824 all live-read, the last QueryInterface-proven. STILL ACTIVE for the reason the exit proof names: no control yet proves the hook is not observing a launcher or secondary swapchain. Was previously graded STATIC, which was stale. Proven live."}
      FarCry2-vr: {state: cleared, evidence: LIVE, note: "D3D10 bridge and WorldExec/pass dispatch are live-mapped."}
      Swat4-VR: {state: cleared, evidence: LIVE, note: "UGameEngine::Draw and scene-node callbacks are hookable and counted; the world/HUD sub-seam remains a stereo question."}
      Sims4VR: {state: active, evidence: LIVE, note: "RenderDoc proves the pass graph, but no shippable engine/frame callback has been selected."}
      SoF-VR: {state: cleared, evidence: LIVE, note: "M1 census over 52 wrapped slots: slots 44 and 47 bracket every frame in every state with equal counts across 60+ buckets, and slot 16 is absent through menu and loading then holds 1:1 with the bracket in gameplay. The thunks are ABI-transparent - no crash, no frame-rate change."}
      Medal-of-Honor-vr: {state: cleared, evidence: LIVE, note: "Frame and render ownership mapped from source with line numbers, confirmed by measured per-second call counts across menu, loading and two maps."}

  - id: BN-CAM-001
    title: Camera, projection, culling, and consumers are not separated
    applies_to: both
    gate: CAMERA
    blocks: Correct 6DoF, peripheral visibility, detached aim, authored-camera yielding, and any claim that a second eye represents a second viewpoint.
    fast_test: Correlate an exact scene projection with a rigid/view candidate across controlled translation and rotation, then enumerate who reads it before and after the intended write seam.
    exit_proof: CAMERA_FINDINGS or RENDER_OWNERSHIP_MAP names the render, game/body, cull, scripted, viewmodel and secondary-view authorities, including invalidation conditions.
    route: "[RE-05/06](reverse-engineered-route.md#re-05) or [SRC-02](source-owned-route.md#src-02)"
    projects:
      ss2vr-work: {state: cleared, evidence: HEADSET, note: "KEX render/cull camera and Dark gameplay consumers are separated; remaining work is feature-level coverage."}
      BioshockVR: {state: cleared, evidence: HEADSET, note: "Player scene-node camera, transient per-eye matrices and foreground ownership are mapped."}
      SOMAVR: {state: cleared, evidence: HEADSET, note: "Player versus authored/secondary HPL frusta are classified and yielded to by state."}
      PreyVR: {state: open, evidence: STATIC, note: "ArkPlayerCamera, CSystem::m_ViewCamera and CRenderView copy-by-value seam are mapped; projection/cull behavior still needs live stereo proof."}
      DishonoredVR: {state: active, evidence: LIVE, note: "Render camera isolated by return address (+0x2C48AE, which immediately builds camera/view/projection in FUN_006c4710 and is reached from the viewport draw) and separated LIVE from nine other per-frame GetPlayerViewPoint consumers; +0x250F25 is the tick-timing consumer that must stay on the body camera. Pose query dispatches through PlayerController vtable +0x3C4; camera location +0x330, integer rotator +0x33C. Camera DELIVERY - parameter or global - remains unknown."}
      FarCry2-vr: {state: active, evidence: LIVE, note: "The shipped rung-2 baseline has headset-proven 6DoF and authored-camera yielding, but the new WorldExec route has not yet proved that its second-pass camera mutation reaches the consuming draw. Treat the working route as the fallback, not evidence for the new route."}
      Swat4-VR: {state: open, evidence: LIVE, note: "Exports and forward census reduce search cost; the stereo camera delivery/seam still needs completion."}
      Sims4VR: {state: active, evidence: LIVE, note: "Python camera control is proven but too smoothed for head tracking; 30 native candidates remain ambiguous pending GPU-value correlation."}
      SoF-VR: {state: cleared, evidence: LIVE, note: "M2: refdef_t confirmed live over a 2000-frame window. Prefix shift +1, unique match, fov_y residual 0.0000 against CalcFov, and fov_x exactly the install fov cvar, which the probe did not know. Two static inferences corrected - time is at +0x44, and +0x00 is written every frame."}
      Medal-of-Honor-vr: {state: cleared, evidence: SOURCE, note: "Camera construction, FOV and first-person offset are source functions in the fork cgame; the retail cgame module is not used."}

  - id: BN-STE-001
    title: The stereo production route is not selected by evidence
    applies_to: both
    gate: STEREO-ARCH
    blocks: The renderer architecture, eye cadence, culling strategy, performance model, and the meaning of every later stereo artifact.
    fast_test: Price and test the highest viable rung in order—native scene re-entry, per-draw replay, alternate-eye, then draw-stream reconstruction—using a control and a reversible eye perturbation.
    exit_proof: STEREO_ROUTE.md records the selected rung, rejected higher rungs, camera delivery method, cost, rollback, and an exit test that distinguishes camera change from repeated side effects.
    route: "[RE-09](reverse-engineered-route.md#re-09), then [PORT-07](shared-vr-spine.md#port-07)"
    projects:
      ss2vr-work: {state: cleared, evidence: HEADSET, note: "Private per-eye targets with alternate-eye fills are the proven shipping route; native cubemap re-entry is a future opportunity."}
      BioshockVR: {state: cleared, evidence: HEADSET, note: "Per-draw private-eye replay is proven; rung-1 reflection/mirror re-entry remains optional research."}
      SOMAVR: {state: cleared, evidence: HEADSET, note: "AFR is the selected route around expensive/side-effectful HPL re-entry."}
      PreyVR: {state: active, evidence: STATIC, note: "RenderWorld plus arbitrary-camera pass construction meet static preconditions; live viability, render-view pools and cost are open."}
      DishonoredVR: {state: active, evidence: STATIC, note: "No stereo route can be committed before camera ownership and D3D9 transport are proven."}
      FarCry2-vr: {state: cleared, evidence: HEADSET, note: "Per-draw stereo works; WorldExec native-stereo viability is the higher-rung investigation."}
      Swat4-VR: {state: active, evidence: LIVE, note: "Scene doubling and AFR are proven possible; the clean world/HUD seam and side-effect gate decide the final route."}
      Sims4VR: {state: active, evidence: LIVE, note: "Multiple world traversals exist, but the reduced height/depth pass is not a borrowable second camera; a full-quality callable seam remains open."}
      SoF-VR: {state: open, evidence: STATIC, note: "R1 native re-entry is DECLARED, not proven: all ten ladder rungs are open and nothing has been written to a refdef yet. The route is cheap by construction, since everything camera-derived is recomputed from the refdef passed in, so per-eye culling should come free."}
      Medal-of-Honor-vr: {state: cleared, evidence: HEADSET, note: "Rungs 0a-0c and 1-7 cleared, 8 partial. Geometric stereo fuses in a headset; rung 7 cleared on real Quest 3 optics, predicted 162.9 px principal-point offset against a measured -163 px, with parallax appearing only where there is depth."}

  - id: BN-SFX-001
    title: A second eye may advance once-per-frame side effects
    applies_to: both
    gate: STEREO-SAFETY
    blocks: Native scene re-entry and any replay whose second image might change simulation, particles, audio, queries, histories, allocators, or observers.
    fast_test: Compare stock, repeated-with-zero-camera-delta control, and repeated-with-eye/yaw-delta test while logging simulation, audio, particle, query and allocation counters.
    exit_proof: The zero-delta control stays at the measured noise floor and a side-effect ledger proves which work runs once per frame, once per view, or is snapshot/restored.
    route: "[RE-09 side-effect gate](reverse-engineered-route.md#the-three-capture-side-effect-gate)"
    projects:
      ss2vr-work: {state: cleared, evidence: LIVE, note: "Current per-draw/AFR architecture avoids re-entering the complete simulation frame."}
      BioshockVR: {state: cleared, evidence: LIVE, note: "Private-eye replay is scoped to eligible rendering work; pair authority and fallbacks are explicit."}
      SOMAVR: {state: cleared, evidence: HEADSET, note: "AFR deliberately avoids same-frame scene re-entry and banks temporal histories per eye."}
      PreyVR: {state: active, evidence: STATIC, note: "RenderWorld viability is not established; global-camera consumers and pooled render views make live ordering mandatory."}
      DishonoredVR: {state: risk, note: "UE3 scene entry has not yet reached a live repeat test."}
      FarCry2-vr: {state: active, evidence: LIVE, note: "M3 question 1 is now live: 3,521 PrepareFrameGraph+WorldExec replays produced a 1.915 draw ratio while the animator stayed at 1.0. This is strong side-effect separation, not the full exit proof: the zero-delta control and remaining audio/particle/query/allocation observers still decide safety."}
      Swat4-VR: {state: active, evidence: LIVE, note: "Scene re-entry passes the pixel proof; the explicit side-effect gate is still unrun and two camera consumers repeat."}
      Sims4VR: {state: risk, note: "Existing repeated passes prove re-entrancy, not that a new full-quality eye invocation is idempotent."}
      SoF-VR: {state: open, evidence: STATIC, note: "Nothing has been mutated yet, so no side-effect gate has been run. M3 is the first reversible write and carries the passthrough control M0 established."}
      Medal-of-Honor-vr: {state: cleared, evidence: LIVE, note: "Per-view ledger: controls A and B against treatments C and D, every once-per-frame counter identical while the view render doubled, disparity 0 at separation 0 and depth-dependent at 2.5 and 10."}

  - id: BN-XR-001
    title: The game graphics path cannot yet deliver owned images to OpenXR
    applies_to: both
    gate: XR-TRANSPORT
    blocks: Headset pixels, adapter matching, swapchain sizing, lifecycle validation, and meaningful headset acceptance.
    fast_test: Submit known-color eye images on the runtime-required adapter before connecting game rendering; separately prove the game image can enter an owned shareable resource.
    exit_proof: Both known-color and game-image transport pass; adapter LUID, API binding, format, synchronization, and recovery behavior are logged.
    route: "[PORT-08](shared-vr-spine.md#port-08) and [graphics API routes](10-graphics-apis.md)"
    projects:
      ss2vr-work: {state: cleared, evidence: HEADSET, note: "D3D11 OpenXR transport and recovery are shipping."}
      BioshockVR: {state: cleared, evidence: HEADSET, note: "D3D11 private-HDR to OpenXR projection submission is sustained."}
      SOMAVR: {state: cleared, evidence: HEADSET, note: "OpenGL OpenXR handoff is proven; transfer cost remains a performance lane."}
      PreyVR: {state: open, evidence: STATIC, note: "D3D11 is compatible, but transport is downstream of the current native-stereo viability gate."}
      DishonoredVR: {state: active, evidence: LIVE, note: "GAME-LESS PROBE (not in-game): Direct3DCreate9On12 -> UnwrapUnderlyingResource -> D3D12 -> OpenXR passes end to end on VirtualDesktopXR 1.0.10, with XR_KHR_D3D12_enable v9 among 31 extensions. Negative control recorded - plain Direct3DCreate9 refuses shared resources (0x8876086C). D3DFMT_A8R8G8B8 opens as DXGI_FORMAT_B8G8R8A8_UNORM unconverted; adapter LUIDs are per-boot handles. Completed-query median 0.224 ms is an IDLE-GPU FLOOR, not a budget. Remains active: known-colour transport only, never a game image."}
      FarCry2-vr: {state: cleared, evidence: HEADSET, note: "D3D10 via shared DXGI surface reaches OpenXR; descriptor/copy compatibility is proven."}
      Swat4-VR: {state: active, evidence: LIVE, note: "9On12 reaches an owned D3D12 resource and XR bring-up passes without hardware; first headset submission remains."}
      Sims4VR: {state: open, evidence: LIVE, note: "D3D11 makes the binding straightforward, but no mod-owned eye resource or XR host exists yet."}
      SoF-VR: {state: open, evidence: STATIC, note: "32-bit runtime shortlist checked on this machine; the runtime choice is deliberately OPEN until M5. No instance, session or submitted frame yet."}
      Medal-of-Honor-vr: {state: cleared, evidence: HEADSET, note: "Session reaches FOCUSED on a Quest 3 through Virtual Desktop with two 2688x2880 sRGB swapchains and 561 plus 588 frames submitted without error. Result-driven fallback proven: with no headset the flat path is untouched."}

  - id: BN-RND-001
    title: Per-eye render state is incomplete or misattributed
    applies_to: both
    gate: RENDER-CORRECTNESS
    blocks: Fusion-correct lighting, fog, shadows, reflections, temporal effects, viewmodels, secondary views, and culling at headset edges.
    fast_test: Classify each suspicious pass by view provenance, producer resource identity, projection companions, history bank, depth owner, and secondary-view target—not by shader or dimensions alone.
    exit_proof: RENDER_PASS_CENSUS states once/per-eye/disabled policy for every material class and a device capture proves the intended workload and resource identities.
    route: "[PORT-09](shared-vr-spine.md#port-09) and [render hazard atlas](14-render-pass-hazard-atlas.md)"
    projects:
      ss2vr-work: {state: open, evidence: HEADSET, note: "Core stereo/culling are proven; reflections, portals, viewmodels and effects remain ownership-sensitive feature lanes."}
      BioshockVR: {state: active, evidence: LIVE, note: "Mono screen-space shadow/light/fog producer resources remain the dominant visual defect after geometry stereo."}
      SOMAVR: {state: active, evidence: LIVE, note: "Refraction/post-effect ownership, occlusion identities and OpenGL transfer timing are current T3 refinement lanes."}
      PreyVR: {state: risk, note: "Deferred CryEngine companions and render-view pools are not yet exercised by a second eye."}
      DishonoredVR: {state: risk, note: "Render-pass census is partial and downstream of transport/camera gates."}
      FarCry2-vr: {state: active, evidence: SOURCE, note: "The headset-proven rung-2 baseline still works. For the native route, classify output by frame/pass/resource generation rather than pointer identity, and prove OMSetRenderTargets interception with a positive control before treating the no-copy census as exhaustive; viewmodel ownership remains separate."}
      Swat4-VR: {state: open, evidence: LIVE, note: "Hazard census is favorable, but the clean world/HUD M-C seam is unresolved."}
      Sims4VR: {state: risk, note: "Depth prepass, shadow atlas and reduced auxiliary pass are identified; per-eye policy is not designed."}
      SoF-VR: {state: open, evidence: LIVE, note: "2D slots are enumerated and counted, but no pass policy is written; the render-pass census exists as a document, not a verdict."}
      Medal-of-Honor-vr: {state: open, evidence: SOURCE, note: "Census drafted from source and awaiting a RenderDoc capture. Sky portal, cutscene camera and inventory views are unexercised, which is exactly where a secondary view enters the eye pair wrongly."}

  - id: BN-POSE-001
    title: Pose, frame, and eye-pair ownership are incoherent
    applies_to: both
    gate: POSE
    blocks: Low-latency head tracking, stable hands/rays, recenter, authored-camera transitions, AFR pair coherence, and tracking-loss recovery.
    fast_test: Stamp tracking sample, simulation frame, render frame, eye, pair generation, recenter generation and every consumer; compare them at the exact transition frame.
    exit_proof: One immutable per-frame pose packet drives all declared consumers, and stale/focus-loss paths neutralize or hold according to a documented policy.
    route: "[PORT-06](shared-vr-spine.md#port-06) and [A2](a2-pose-pipeline.md)"
    projects:
      ss2vr-work: {state: cleared, evidence: HEADSET, note: "AFR pair latching, render/game pose separation and recenter ownership are implemented."}
      BioshockVR: {state: cleared, evidence: HEADSET, note: "Pair authority and shared recenter/height baselines are explicit; feature consumers still require regression tests."}
      SOMAVR: {state: cleared, evidence: HEADSET, note: "AFR history banking, pose latch, authored-state transitions and recenter generations are live."}
      PreyVR: {state: risk, note: "The downstream CRenderView seam avoids contaminating the cached aim ray, but no live eye pair exists."}
      DishonoredVR: {state: risk, note: "No render-pose packet has reached a headset path."}
      FarCry2-vr: {state: active, evidence: SOURCE, note: "The working 6DoF baseline is headset-proven, but a native pair does not yet carry one atomic pixels+pose/FOV/contract/resource-generation publication. Current unsynchronised SharedSurface fallback cannot establish pair coherence."}
      Swat4-VR: {state: open, evidence: LIVE, note: "Eye tagging is live and pair IDs are desk-tested; headset timing and final route are pending."}
      Sims4VR: {state: risk, note: "Python camera interpolation is explicitly unsuitable as the render-pose transport."}
      SoF-VR: {state: open, evidence: STATIC, note: "The refdef fields the pose lane needs are identified with receipts, but no pose has been composed onto them."}
      Medal-of-Honor-vr: {state: active, evidence: HEADSET, note: "Head composition proven: headset yaw composed once per frame onto the body after eye placement, verified in the log and measured in pixels at 30.0 degrees, correlation 0.96. World scale remains open as H-005 and is the live question."}

  - id: BN-INP-001
