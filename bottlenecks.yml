  - id: BN-PERF-001
    title: The fresh-frame budget and dominant cost are not measured
    applies_to: both
    gate: PERFORMANCE
    blocks: Choosing native re-entry versus AFR, valid optimization, mobile thermal stability, and honest hardware requirements.
    fast_test: Record release-build CPU update, scene preparation, each eye, synchronization, submit, GPU, stale/reprojected frames and thermal state under matched device visuals.
    exit_proof: PERFORMANCE_BASELINE identifies the dominant metric and a preregistered A/B moves that metric without changing workload or image validity.
    route: "[PORT-12](shared-vr-spine.md#port-12) and [PERF-002](pattern-catalog.md#perf-002)"
    projects:
      ss2vr-work: {state: open, evidence: LIVE, note: "Performance telemetry exists; debugger/logging distortion and fresh-frame cadence remain recurring acceptance concerns."}
      BioshockVR: {state: active, evidence: LIVE, note: "Two eye renders plus a desktop world render dominate; reusable buffers help, but eliminating the third world render is the architectural lever. KSA_XR independently corroborates the knowingly inefficient three-frame problem on Vulkan; Scrap Mechanic demonstrates the worked D3D11 answer by mirroring the finished left eye with one three-vertex fullscreen draw."}
      SOMAVR: {state: active, evidence: LIVE, note: "OpenGL-to-XR handoff cost, occlusion/query behavior and thermally valid device timing are being priced."}
      PreyVR: {state: risk, note: "Native scene re-entry cost is unknown until a live second pass exists."}
      DishonoredVR: {state: risk, note: "Transport choice will determine synchronization and copy cost."}
      FarCry2-vr: {state: active, evidence: LIVE, note: "Frame pacing and 60-versus-90 cadence remain open alongside native-stereo work."}
      Swat4-VR: {state: open, evidence: LIVE, note: "Flat noise floor and pacing census exist; headset fresh-frame cadence remains."}
      Sims4VR: {state: risk, note: "8x MSAA main targets and multiple scene traversals are visible, but no VR workload has been measured."}
      SoF-VR: {state: risk, note: "144 fps flat with 52 slots wrapped and no measurable cost, but the vsync cvar must go to zero before the XR lane, since the runtime paces the frame."}
      Medal-of-Honor-vr: {state: risk, note: "Frame-cap policy landed - the cap is released once a session exists so the runtime paces the frame - but no VR frame-time budget has been measured."}

  - id: BN-PACK-001
    title: Build, version, install, and recovery contracts are not shippable
    applies_to: both
    gate: RELEASE
    blocks: Reproducible user installs, safe updates/uninstalls, supported-build enforcement, and credible bug reports.
    fast_test: Run a clean-install/uninstall matrix on a machine/profile without the developer's runtime, PATH, registry, caches or previous proxy DLLs.
    exit_proof: Known builds are signature/hash guarded, unknown builds fail closed, install/uninstall are recoverable, dependencies and anti-cheat boundaries are explicit, and logs self-identify.
    route: "[PORT-13](shared-vr-spine.md#port-13)"
    projects:
      ss2vr-work: {state: cleared, evidence: SOURCE, note: "Packaging and self-identification are mature; each new feature still needs rollback/default validation."}
      BioshockVR: {state: open, evidence: SOURCE, note: "Canonical package path and guards exist; runtime/implicit-layer/startup variability remains a support surface."}
      SOMAVR: {state: cleared, evidence: SOURCE, note: "OpenXR/non-OpenXR build flavors, loader locality and runtime recovery are explicit."}
      PreyVR: {state: risk, note: "Landmark gates are designed, but the mod is not at release scope."}
      DishonoredVR: {state: risk, note: "Exact binary hash is pinned; no releasable transport exists."}
      FarCry2-vr: {state: open, evidence: SOURCE, note: "Launch/build prerequisites and wrapper cleanup are explicit; feature path is still T1."}
      Swat4-VR: {state: open, evidence: SOURCE, note: "Fresh-log launch and test config are disciplined; first headset and release defaults remain."}
      Sims4VR: {state: risk, note: "Research target; distribution boundaries for Python/script replacement plus a native layer are not designed."}
      SoF-VR: {state: open, evidence: STATIC, note: "Delivery is a proxy DLL beside the stock renderer, selected by a cvar, with no installed file modified. Packaging itself is unbuilt."}
      Medal-of-Honor-vr: {state: open, evidence: SOURCE, note: "A source port ships a replacement executable, so packaging must carry GPL obligations and the fork maintenance contract; the fork remote does not exist on GitHub yet."}

