# sources.yml — coverage judgements plus reproducibility metadata.
#
# This file records what a human/agent DECIDED about each source: which areas were
# reviewed, to what depth, and at what evidence grade.
#
# Paths, identity and the reviewed snapshot belong here because they define what was
# actually inspected. File counts, current revision and last modification are measured
# by tools/coverage.py. A reviewed/current revision mismatch is deliberately loud.
#
# Rule: a source absent from this file appears in the generated dashboard as
# NEVER REVIEWED. That is the point — omission must be loud.
# These are deliberately separate axes:
# - fleet `authority` records who owns the shipping integration selected by PORT-01;
# - external `vehicle` records how a reference mod is delivered/built; `documentation`
#   is for a source that ships no mod at all and was harvested for its method.
# `tier` is achieved completeness; an aspiration belongs in optional `tier_target`.
# `stereo_rung` is one of unproven/R1/R2/R3/R4, never a mixture of integers and prose.
#
# review:   full | partial | skimmed | not_reviewed
# evidence: SPEC | SOURCE | STATIC | LIVE | HEADSET | AUTHOR | INFERENCE
#   SPEC      normative API fact (OpenXR spec, D3D docs)
#   SOURCE    read in the project's own source
#   STATIC    binary / static RE
#   LIVE      observed at runtime
#   HEADSET   accepted in a headset
#   AUTHOR    the author's claim only — not independently checked
#   INFERENCE transferable hypothesis; not established on this target

