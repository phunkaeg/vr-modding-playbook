      xr_input:     {review: partial, evidence: SOURCE, note: "harvested 2026-09-07 into ch03 #context-by-hand and INPUT-011: four face buttons bound raw by hand and physical position, meaning resolved per hand against what that hand holds, symmetric across hands, every action targeting the hand that pressed. LOCOMOTION harvested 2026-09-07 into ch03 #physical-locomotion-verb, INPUT-012 and TEST-023: a nine-PR hand-climbing campaign whose first change was the BENCH (debug_ladder, one station per climbing shape including a non-climbable wall, built from shipped ladder templates) and whose second was the physics grip query ALONE, query-only with no body motion. Grip qualifies on the AUTHORED per-face climbable mask rather than the collider bounding box, permuted from the tool Z-up frame into the engine Y-up one. Release throws the body by the anchor hand travel RELATIVE TO THE PAWN over four frames, capped in magnitude and - the transferable cap - capped upward at the ordinary jump launch speed so a haul can never rise higher nor fall further than a jump, because the game scores falls. Velocity is expressed in PHYSICS STEPS so the throw matches the pull at 72/90/120 Hz. The vault predicate carries a state-at-acquisition term (the eye was BELOW the lip when the hold was taken) which is what stops leaning on a crate being a mantle, and a failed top-out plan changes nothing rather than breaking. Grip forgiveness is two mechanisms, spatial (0.3 wu lip search) and temporal (squeeze eligible 150 ms). Capsule resize is anchored on the body CENTRE while hanging because the feet-planted shift exceeds the grip stretch tolerance, and on the feet when grounded. Crouch applies one head-resolved translation to eyes, hands and gameplay head. Same week, melee billing moved from raw centre-of-mass speed to CLOSING speed at the contact point along the contact normal. They mark headless coverage as proving mechanism and NOT comfort, explicitly."}

