      camera_tracking:  {review: full,    evidence: SOURCE}
      hands_interaction: {review: full,    evidence: SOURCE}
      ui_hud:           {review: partial, evidence: SOURCE}
      re_discovery:     {review: full,    evidence: SOURCE}
      xr_lifecycle: {review: full, evidence: SOURCE, note: "Harvested 2026-08-25 into ch09 (session state machine, focus-loss input neutralization, keep-submitting fallback, 10-row recovery matrix). EXTENDED 2026-08-29 from M2-D3D9-BRIDGE.md into ch09 #d3d9ex-vs-classic, #bridge-protocol and #late-attach: F.E.A.R. creates a CLASSIC IDirect3DDevice9 and a shared texture on it is refused with D3DERR_INVALIDCALL, so the project carries a GPU path for D3D9Ex (StretchRect into three shared slots per eye, D3DQUERYTYPE_EVENT fence, versioned IPC, OpenSharedResource + CopyResource, fullscreen shader into both swapchains, NO CPU readback) and a flagged CPU compatibility path for classic D3D9 - published as FEARVR_BF_CPU_FALLBACK, logged as path=cpu_d3d9ex, and named in the doc as debt against the stated invariant 'no per-frame CPU readback'. Protocol: three slots per eye with EMPTY/WRITING/READY/CONSUMING, separate host and game heartbeats, BOTH adapter LUIDs checked before import, a seqlock, and every kernel object carrying a RANDOM SESSION ID so two instances cannot collide; magic, version, header size, slot size and slot count all validated on connect, header exactly 432 bytes in x86 and x64. Late attach is mandatory here - the -archcfg GameClient module loads AFTER the engine creates its device, so an IAT hook on Direct3DCreate9 is too late; they create a hidden helper device to read the Present/Reset targets and detour outside DllMain."}
      xr_input:         {review: full, evidence: SOURCE, note: "Harvested 2026-08-25 into ch03: physical action transport, semantic mapping at the game boundary, profile-change logging, focus/staleness neutralization, action edges and reverse haptics."}
      performance: {review: full, evidence: SOURCE, note: "2026-08-29 (was not_reviewed, and it held the largest unharvested material in the ledger). Harvested into ch19. THREE PER-FRAME DRIVER CALLS THAT DID NOT BELONG, with before/after: OpenSharedResource per eye per game frame is 'a kernel call with a driver lock, not a pointer copy' - six slots exist, so open once and memoise by handle; CreateRenderTargetView per eye per XR image, when the swapchain image count is fixed after enumeration (release views BEFORE the images, a view holds a reference); Flush per eye when once per frame suffices. copy_avg_us 310-440 with spikes to 3772 became 82-106 with max 612, and xr_fps went from dipping to 72.8 to never below 89.4 over 102 windows / 30,600 frames. THE BUDGET DECOMPOSITION is the reusable part: frame_cpu_max_us is own work between xrBeginFrame and xrEndFrame MINUS the compositor-controlled waits, with section peaks that together cover the frame - which is how they could show all 19 long frames were >90% xrEndFrame rather than their own code. pose_fallback: an imported image with no remembered render pose gets the CURRENT pose forced on it, so the compositor believes it fresh and STOPS reprojecting - and only the first occurrence had ever been logged. Two hypotheses recorded as wrong (async logger, Flush)."}
      audio:            {review: not_reviewed}
      packaging_deploy: {review: partial, evidence: SOURCE, note: "MATURITY, recorded here because the external schema has no tier or stereo_rung field: this is at M6 with M5 confirmed in-headset on Quest 3 and SteamVR - native stereo world rendering, head tracking, world-locked menu, stereo HUD, OpenXR controllers driving movement, turning, weapon selection, reloading, crouching, slow-mo, melee and lean by left-hand tilt, plus a visible first-person body and a native VR settings page. Roughly a T3 equivalent on a 2005 D3D9 title. Loads through the official -archcfg module layer, leaving the retail directory unmodified."}
      source_integration: {review: partial, evidence: SOURCE, note: "Official SDK used to define native stereo and expose the CRT ABI shipping boundary."}

