      camera_tracking:   {review: full, evidence: SOURCE, note: "CAM-004 now has three title-specific FOV contracts: BS1 true-horizontal; BS2 16:9-referenced horizontal with a live option that animates 73-96 degrees; Infinite's rendered lens is vertical-referenced, while its later camera-degrees lever is horizontal at a fixed 16:9 anchor (the same lens expressed at a different ownership boundary). Infinite claimRatioH baseline 0.5576."}
