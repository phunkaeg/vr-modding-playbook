      stereo: {review: full, evidence: SOURCE, note: "2026-08-29 deep read of ENGINE_NOTES. CLOSES the widen-vs-cull problem bfbc2-vr left open, harvested into ch14 #forced-projection and CAM-010. (1) Their projection layer submitted the HEADSET's FOV while the game rendered 65 deg at 16:9 - a uniform stretch, so head movement, world scale and object size were all wrong TOGETHER and nothing could be judged against anything else. (2) Read the frustum OUT OF THE MATRIX rather than asking the engine: column lengths are the projection scales, tan(halfFov) the reciprocal - no need to know whether FOVAngle is horizontal or vertical. (3) Match the headset's VERTICAL FOV: a 16:9 game against a near-square per-eye view already has horizontal surplus. (4) Widening THROUGH the engine widens its culling too. (5) But the engine will not HOLD it - against a steady 127.9 deg the matrix reported 125.3 / 127.2 / ... / 80.7, because the camera update interpolates back each tick with step size set by frame duration. (6) THE FIX: force the frustum in the matrix (rescaling x/y columns IS an FOV change), demote the engine's FOV to culling and ask it for 15% more than you render, and submit the forced constant to OpenXR - a submitted frustum that tracks the engine inherits every wobble."}
      camera_tracking: {review: not_reviewed}
      hands_interaction: {review: full, evidence: HEADSET, note: "2026-08-29 HISTORY.md read. Harvested into ch02 #identity-latch: latching onto a runtime-identified mesh needs THREE states, not two - a retry keyed on an EMPTY result cannot detect a latch onto WRONG data, and their menu latch took two non-gun entries, returned true and silenced its own retry ('the report that came back was accurate; the labels on it were fiction'). The fix validates continuously against whether the latched mesh is still drawn, with an EMPTY list counted as neither hit nor miss because cutscenes have no first-person pass. Also ch12 #one-scale-three-users: kMetresToUU = 52.5 is UE3's documented 16 units per foot exactly, and the stereo baseline, the 6-DOF translation and the hand position must all flow through it - scaling IPD alone makes the world resize AS YOU MOVE, the exact complaint a world-scale slider exists to fix. A held object that shifts on recentre is anchored to the engine's eye rather than the player's."}
      ui_hud: {review: partial, evidence: SOURCE, note: "2026-08-29: ch04 #silent-glyph-fallback - GlyphIndex returns SPACE for unknown characters, so '*RESTART*' drew as ' RESTART ' and the > / < page markers had been invisible since they shipped. A missing-glyph box is a bug report; a space looks like a design decision. Also ch09 #clip-space-immune: a fullscreen quad already in clip space reads no camera register, so a constant-remap stereo path is a NO-OP on it - both copies land at identical coordinates and each is scissored to its own half. The HUD was always fine because its shader does read the registers being transformed. And a SECOND view-projection at vs c13 was never remapped, surfacing as mis-projected shadows rather than mis-placed geometry."}
      re_discovery: {review: full, evidence: SOURCE, note: "2026-08-29. Major contributor across ch11. UObject property reflection walk (Children +0x4C, Next +0x40, Offset +0x64, FName index +0x2C, SuperField +0x3C) makes any property addressable BY NAME, retiring per-field signature scans - validated by solving against two known answers (Actor.Location +0x54 AND Actor.Rotation +0x60) and then corroborated by a spacing never fitted (SkeletalMeshComponent Translation/Rotation/Scale/Scale3D at UE3's declared sizes). Also: #entropy-triage (.text at exactly 8.000 = encrypted, .rdata plaintext, which is why symbols read but code does not); #drm-free-twin (the GOG copy is the SAME build - identical PE timestamp and section sizes, file-size delta exactly the .bind size - so analyse that and the addresses hold in the Steam process); #probe-point and RE-007 (the w-cancellation test goes vacuous at the origin, and dotFwd against the known facing both rejects false hits and resolves ROW vs COL); #silent-write-two-causes (Translation +50 UU moved the mesh +0.0 - a CACHED consumer, not a derived output, which CORRECTS RE-006 as first written); #field-level-authority (mCurrentPOV.FOV is read, mCurrentPOV.Rotation is a copy - one struct, opposite verdicts, and the real source is AActor::Rotation two levels upstream of four mirrors); #per-probe-tolerance (1 UU at the origin where nothing goes stale, 25 UU for world probes)."}
      xr_lifecycle: {review: full, evidence: SOURCE, note: "2026-08-29, harvested into ch09 #no-d3d9-binding and #decay-not-freeze. OpenXR has NO D3D9 graphics binding and the game calls Direct3DCreate9 not ...9Ex, so shared-surface interop is unavailable; three ranked routes recorded, with D3D11_RESOURCE_MISC_SHARED_KEYEDMUTEX having no D3D9 counterpart. 'Do not build scaffolding around an unproven pipe' - three independent scoping steps precede writing the mod. Separately: a 6-DOF offset FROZE at 0.9 m permanent displacement because orientation and position do not fail together (IMU carries rotation, position needs cameras) and skipping the update held the last value forever; the fix decays toward neutral when XR_VIEW_STATE_POSITION_VALID_BIT is clear."}
      xr_input: {review: full, evidence: SOURCE, note: "2026-08-29, harvested into ch03 #resting-controller and ch18 #xinput-emulation-traps. A Touch controller SET DOWN reports a sustained partial trigger pull - left 0.34-0.43, right 0.23-0.28, isActive true on all 120 frames - which clears a 0.10 deadzone, reaches the game as LT~97/RT~64 and maps to AIM and FIRE, so the weapon fires by itself and framerate drops from 120 to 98. Nine runs and five buried mechanisms preceded it because the fault was never in the engine's input plumbing. Separately, two silent XInput-emulation traps: the exe imports BY ORDINAL so a name-keyed IAT patch finds nothing and REPORTS SUCCESS (detour the function body instead), and dwPacketNumber must advance only on change - incrementing every call defeats the game's skip-unchanged path, never incrementing makes it ignore you, and both fail quietly."}
      performance: {review: full, evidence: SOURCE, note: "2026-08-29, harvested into ch19 and ch14. THE WAIT IS THE DISCRIMINATOR: their reprojection warning tested frame time against display period and fired on a run with reprojection off, because 60 fps against 120 Hz is 2.00x by definition; the real test is xrWaitFrame - large means the runtime is holding you back, near zero (they measured 0.1-0.9 ms of a 16 ms frame) means you are genuinely busy. An app that is merely slow never idles. Also: the engine issues a D3DQUERYTYPE_OCCLUSION query per primitive and skips the primitive on a LATER frame if it returned zero - a per-view decision applied to both eyes with a frame of latency; overriding GetData to report visible took draws from ~1000 to a peak of 2272-3809 and 'can never wrongly delete geometry, only fail to save work'."}
      audio: {review: not_reviewed}
      packaging_deploy: {review: partial, evidence: SOURCE, note: "harvested into ch18 #uncontended-proxy: XINPUT1_3 proxy rather than d3d9/dxgi, which ReShade, DXVK and Special K all contend for - and because the game already reads XInput, motion controllers compose into an XINPUT_STATE with ZERO engine hooks, so playability arrives before any gameplay RE does."}
      source_integration: {review: not_reviewed}

